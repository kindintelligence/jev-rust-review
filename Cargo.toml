[package]
name = "jev-rust-review"
version = "0.1.0"
edition = "2024"
rust-version = "1.88" # single source of truth: Clippy and CI both read this
description = "MCP server for Rust-aware code review: TypeSafe Jev triage and finding verification for Claude Code and other agents"
license = "MIT"
repository = "https://github.com/kindintelligence/jev-rust-review"
readme = "README.md"
keywords = ["rust", "code-review", "mcp", "claude-code", "jev"]
categories = ["development-tools"]
# Plugin material is not part of the crate. `fixtures/` stays out too, so the
# packaged crate builds but its fixture-driven tests only run from a checkout.
exclude = [
    "fixtures/",
    "scripts/",
    "skills/",
    "agents/",
    ".claude-plugin/",
    ".mcp.json",
    ".github/",
    "DESIGN.md",
]

# No [lib] or [[bin]] sections: src/lib.rs and src/main.rs are auto-detected
# and the names Cargo derives are the ones that were spelled out before.

[dependencies]
rmcp = { version = "3.4", features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "io-std", "process", "time", "sync"] }
# `rustls`: no OpenSSL to find at build time. `system-proxy`: proxy environment
# variables are honoured without it, but macOS and Windows system proxy
# settings are not, and corporate machines are where that bites.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: Choice options and the questions map reach Jev in the
# order we wrote them instead of alphabetically, and snapshots stay readable.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1"
thiserror = "2"
tracing = "0.1"
# No `ansi`: stderr is captured by the MCP client, where colour codes are noise.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

# ── Lints ────────────────────────────────────────────────────────────────────
# Levels live here; thresholds and the disallowed lists live in clippy.toml.
# CI runs with `-D warnings`, so "warn" fails the build there and stays
# non-blocking while iterating locally.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn" # an `expect` that explains the invariant is fine, so expect_used stays off
panic = "warn"
indexing_slicing = "warn"
dbg_macro = "warn"
todo = "warn"
excessive_nesting = "warn"
cognitive_complexity = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
doc_markdown = "warn"

# ── Profiles ─────────────────────────────────────────────────────────────────
# The server waits on git and HTTP, so runtime speed is irrelevant. Compile
# time is not: scripts/launch.sh falls back to `cargo build --release` on a
# user's machine, inside the MCP startup window. Keep `release` fast to build.
[profile.release]
opt-level = 2
lto = false
strip = true
# Unwinding stays on deliberately: a panicking task is reported through its
# JoinHandle instead of taking the whole server down mid-review.

# Shipped binaries are built once in CI, so they can afford the slow settings:
#   cargo build --profile dist    (output lands in target/dist/)
[profile.dist]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
